# ck3bench's build file. ck3bench depends on ck3agent at one exact version.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ck3bench"
dynamic = ["version"]
description = "Crusader Kings III as an environment for LLM agents: seats as agents, typed tool-call actions, rewards from game state"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Harrison Stebbins" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Private :: Do Not Upload",
]
dependencies = [
  "ck3agent==2026.12.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# the optional Anthropic adapter (ck3bench.env.anthropic_model); never called by the tests
anthropic = ["anthropic>=0.40"]

[project.scripts]
ck3bench = "ck3bench.cli:main"

[project.urls]
Homepage = "https://github.com/skullbloc/ck3bench"
Toolkit = "https://github.com/skullbloc/ck3agent"

[tool.hatch.version]
path = "ck3bench/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ck3bench"]
exclude = ["**/test_*.py", "**/__pycache__", "**/*.local.toml"]

[tool.hatch.build.targets.sdist]
include = ["/ck3bench", "/tests", "/docs", "/README.md", "/LICENSE", "/NOTICE", "/CITATION.cff", "/CHANGELOG.md", "/SECURITY.md", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md", "/VERSION", "/UPSTREAM"]
exclude = ["**/__pycache__", "**/*.local.toml"]

[tool.pytest.ini_options]
testpaths = ["ck3bench", "tests"]
addopts = "-q -p no:cacheprovider"
