# scale0: the seats-per-game scaling pilot (November 2026): N concurrent seats on one
# 867 game for N = 2, 4, 6 and 8; N = 12 was refused by the memory projection before
# it ran.
#
# The pilot ran the public ck3agent 2026.11.0 tarball straight through `ck3agent run`,
# under no registration document and no conditions block. The [episode] and
# [budget] keys below are DECLARED FOR THE BLOCK, NEVER ARMED: the bridge's
# compiled-in values where the pilot set nothing (the mode, the strictness
# leg, the speed, the exclusion fraction), each commented with its source, and
# a horizon the pilot never declared to the bridge, with the span each round
# realised recorded beside it from the pilot's results table. They are here so
# this file generates a block the launcher parses, not because the pilot
# declared them.
#
# Host values (the lock, the display, the ollama unit, the saves directory,
# the tarball path) live in the untracked scale0.local.toml beside this file.

[experiment]
name = "scale0"
intent = "pilot"
description = "N concurrent Sonnet seats on one 867 game, 3 cycles each, N in the sweep until a stop rule fires"

[registration]
# The block vocabulary in force when the pilot ran (pre-registration v2);
# the pilot itself was launched under no document, so none is named.
version = "2"

[toolkit]
ck3agent = "2026.11.0"
tarball_sha256 = "dc059ad135bfc5cad346e353383b92fe92c02dc861f00c4e89d0e0dc4ee7a36a"   # the release tarball the pilot installed

[save]
basename = "_867_01_01.ck3"       # the 867.01.01 observer save; a fresh copy per round
sha256 = "1a08927d4515ebaeb20f528f56430084348556359606ac54d2ba4b47a82bc5be"   # the copy the pilot booted; the same hash in an earlier run's record

[episode]
mode = "free_play"                 # CK3_EPISODE_MODE unset; the bridge reads absence as free play
strict_build_id = true             # CK3_STRICT_BUILD_ID is compiled ON in the public release build the tarball carries
# Declared for the block, never armed: scale0 declared no horizon to the bridge
# (3 cycles of `session wait seconds=60`); this is a one-game-year pilot window.
# Realised per round: N=2 0867.01.01->0867.06.01 (151 d),
# N=4 ->0867.12.26 (359 d), N=6 ->0867.08.08 (219 d), N=8 ->0867.09.03 (245 d).
# Every round started at the save's date, two days before the declared start,
# and ended before the declared end.
horizon = ["867.01.03", "868.01.03"]
game_speed = 2                     # the bridge's compiled-in resting speed
unavail_exclusion_fraction = 0.05  # the bridge's default exclusion fraction; unarmed in the pilot (no horizon declared to the bridge)

[seats]
source = "list"
# The 12 seats the pilot selected at the open sample (the rule, verbatim):
# "query(characters, independent, sort realm_counties, 60) in returned order; keep alive,
# independent, realm_counties>=2, age 20..60, war_count==0 at the open sample; greedy in
# that order: no shared border with an already-accepted seat and (pass 1) a de-jure
# kingdom (of the primary title) not used by an accepted seat; (pass 2, only if pass 1
# gave <12) kingdom repeats allowed, border rule kept; first 12". Round N takes the first N.
ids = [13191, 12015, 11329, 14942, 10647, 13746, 12843, 13475, 11244, 12809, 13889, 14374]
model = "sonnet"                   # `ck3agent run --model sonnet`; the manifests resolved it to claude-sonnet-5
cycles = 3
wait_seconds = 60                  # the goal text: "Use session wait with seconds=60 between cycles"
max_turns = 80
wall_seconds = 480
# Goals, alternating by seat index (odd seats expand, even seats consolidate);
# {name}, {cid}, {others} are the seat's name, character id and the other seats' ids.
goals = [
  "You are {name} (character {cid}). Expand: find a declarable war and declare it if one exists; otherwise fabricate a claim. Never target characters {others} (other players). Use session wait with seconds=60 between cycles.",
  "You are {name} (character {cid}). Consolidate: start no wars, secure the succession, keep the realm stable. Use session wait with seconds=60 between cycles.",
]

[seats.billing]
accounts = ["subscription"]        # apiKeySource none in every manifest: a Claude Code subscription
account = "subscription"           # every episode billed to the one allowed account

[sweep]
n = [2, 4, 6, 8, 12]               # 2, 4, 6, 8 ran clean; 12 was refused by the memory projection before it ran

[budget]
enforce = false                    # no CK3_BUDGET_* set; the registration's inert pilot lines
per_agent_per_year = 1
ceiling_basis = "pilot_placeholder"
cap_usd = 40                       # the pilot's cap: stop when cum + N * max_seat_cost > cap

[tool_surface]
# The 2026.11.0 server's 13 registered tools.
held_constant = [
  "cbs", "declare_war", "discover", "do", "inspect", "observe", "pass_turn",
  "plan_war", "query", "session", "set_phase", "steer", "succession_plan",
]

[runner]
# The stop rules between rounds, as the pilot applied them (the first pass
# measured per_seat_gb=0.56 from N=2 instead of the constant).
memory_floor_gb = 20               # MemAvailable + SwapFree floor, the live suite's; never lowered
per_seat_gb = 0.5                  # projection: first_free_prev - N * per_seat_gb - growth_gb >= floor
growth_gb = 1.0
timeout_pct_max = 5                # game-thread + read timeouts over MCP calls, per round
